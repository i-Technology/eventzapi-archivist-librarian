services:
  archivist:
    build:
      context: .
      dockerfile: Dockerfile.operational
    image: eventzapi-operational:0.3
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env
    command:
      - --queue
      - ${EVENTZ_QUEUE:-eventz.archivist}
      - --archive
      - /Y/compose.tsv
    volumes:
      - ./compose-Y:/Y
    restart: "no"
